name: ${COMPOSE_PROJECT_NAME:-new0-game}
x-logging: &logging
  driver: local
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILES:-3}
services:
  web:
    image: ${WEB_IMAGE:-new0-game-web:dev}
    build: .
    environment:
      WEB_PORT: ${WEB_PORT:-80}
      API_UPSTREAM: api:${API_PORT:-8000}
      NGINX_ENVSUBST_FILTER: ^(WEB_PORT|API_UPSTREAM)$
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PUBLISH_PORT:-${PORT:-8085}}:${WEB_PORT:-80}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -T, '${HEALTH_REQUEST_TIMEOUT_SECONDS:-3}', -O, /dev/null, 'http://127.0.0.1:${WEB_PORT:-80}/health']
      interval: ${HEALTH_INTERVAL:-15s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${HEALTH_START_PERIOD:-10s}
  api:
    image: ${API_IMAGE:-new0-game-api:dev}
    build:
      context: ./server
      target: base
    environment:
      UVICORN_HOST: ${API_HOST:-0.0.0.0}
      UVICORN_PORT: ${API_PORT:-8000}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-0}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LEADERBOARD_VERSION: ${LEADERBOARD_VERSION:-prototype-001}
      LEADERBOARD_TITLE: ${LEADERBOARD_TITLE:-Тестовый архив 001}
      COMPETITION_OPEN: ${COMPETITION_OPEN:-false}
      ATTEMPT_LIMIT: ${ATTEMPT_LIMIT:-0}
      ALLOW_GUEST: ${ALLOW_GUEST:-true}
      DATABASE_PATH: ${DATABASE_PATH:-/data/game.sqlite3}
      SHOP_URL: ${SHOP_URL:-https://new0.shop/}
      DROP_URL: ${DROP_URL:-https://new0.shop/}
      AUTH_MAX_AGE_SECONDS: ${AUTH_MAX_AGE_SECONDS:-900}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      RUN_TTL_SECONDS: ${RUN_TTL_SECONDS:-7200}
      MIN_ACTION_INTERVAL_SECONDS: ${MIN_ACTION_INTERVAL_SECONDS:-0.2}
      DIAGNOSTIC_TTL_SECONDS: ${DIAGNOSTIC_TTL_SECONDS:-86400}
      CLIENT_REQUEST_TIMEOUT_MS: ${CLIENT_REQUEST_TIMEOUT_MS:-30000}
      CLIENT_BOOTSTRAP_ATTEMPTS: ${CLIENT_BOOTSTRAP_ATTEMPTS:-3}
    volumes:
      - game-data:/data
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [CMD, wget, -q, -T, '${HEALTH_REQUEST_TIMEOUT_SECONDS:-3}', -O, /dev/null, 'http://127.0.0.1:${API_PORT:-8000}/api/health']
      interval: ${HEALTH_INTERVAL:-15s}
      timeout: ${HEALTH_TIMEOUT:-5s}
      retries: ${HEALTH_RETRIES:-5}
      start_period: ${HEALTH_START_PERIOD:-10s}
  tests:
    image: ${TEST_IMAGE:-new0-game-tests:dev}
    profiles: [test]
    build:
      context: ./server
      target: test
    command: ["python", "-m", "pytest", "-q", "-o", "cache_dir=/tmp/new0-pytest"]
    environment:
      DATABASE_PATH: /tmp/test-game.sqlite3
      ALLOW_GUEST: "false"
volumes:
  game-data:
