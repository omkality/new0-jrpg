name: Whole-world browser resources
on:
  workflow_dispatch:
  pull_request:
    branches: [dev, master]
    paths:
      - "index.html"
      - "src/**"
      - "public/assets/**"
      - "public/fonts/**"
      - "scripts/performance/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/assets/package*.json"
      - "vite.config.ts"
      - ".github/workflows/browser-resources.yml"
permissions:
  contents: read
concurrency:
  group: browser-resources-${{ github.ref }}
  cancel-in-progress: true
jobs:
  resource-soak:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: world
            check: resource-soak
            minutes: 30
            artifact: browser-resource-report
          - suite: portrait
            check: portrait-gameplay
            minutes: 40
            artifact: portrait-gameplay-report
    env:
      NEW0_RESOURCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run browser suite
        run: node scripts/performance/run-docker.mjs --suite=${{ matrix.suite }}
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: scripts/performance/results/
          if-no-files-found: warn
          retention-days: 7
      - name: Clean up only the named test container
        if: always()
        run: docker rm --force "new0-resources-${NEW0_RESOURCE_RUN_ID}" 2>/dev/null || true
